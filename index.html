/* Immersive flight: controls never take space away from the canvas. */
#app{position:relative;max-width:1180px;width:100%;padding:0;height:100dvh;isolation:isolate}
#arena{position:absolute;inset:0;margin:0;border:0;min-height:0}
header{position:absolute;z-index:5;top:env(safe-area-inset-top,0px);left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));height:54px;min-height:0;border:0;pointer-events:none}
header a,header button{pointer-events:auto}.top-actions button{height:44px;min-width:44px;font-size:12px}
#app[data-screen="playing"] .brand,#app[data-screen="playing"] #music,#app[data-screen="playing"] #sound{display:none}
.top-actions{margin-left:auto}
#hud{top:calc(env(safe-area-inset-top,0px) + 14px);left:max(14px,env(safe-area-inset-left,0px));right:calc(max(14px,env(safe-area-inset-right,0px)) + 58px)}
#hud strong{font-size:22px;margin-top:4px}#hud small{font-size:12px;letter-spacing:1px}#hp{font-size:15px!important}#combo,#time{font-size:12px;margin-top:4px}
#mission{top:calc(env(safe-area-inset-top,0px) + 98px);left:14px;right:14px;font-size:12px}#mission>i{margin-top:5px}#bossbar{top:calc(env(safe-area-inset-top,0px) + 130px);left:20%;right:20%}
#app:not([data-screen="playing"]) #hud,#app:not([data-screen="playing"]) #mission,#app:not([data-screen="playing"]) #bossbar{visibility:hidden}
#flight-controls{position:absolute;z-index:3;inset:auto max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:end;gap:10px;padding:0;margin:0;pointer-events:none}
#flight-controls[hidden]{display:none}#flight-controls button{pointer-events:auto;touch-action:manipulation;box-shadow:0 3px 14px #0004}
#guide{z-index:2;bottom:calc(env(safe-area-inset-bottom,0px) + 88px);left:14px;right:14px;max-width:460px;margin:auto;background:#091c2dd9;padding:8px;font-size:13px}
#notice{top:29%;font-size:16px}.desktop-hint{display:none}
#overlay{z-index:4;padding:calc(env(safe-area-inset-top,0px) + 70px) 18px calc(env(safe-area-inset-bottom,0px) + 18px)}

/* Four direct weapon keys, two abilities, one shallow row. */
#flight-controls{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 6px);gap:8px;align-items:center}
#weapons{display:flex;flex:none;gap:4px}.abilities{display:flex;flex:none;gap:4px}
#weapons button,#bomb,#boost{position:relative;flex:none;width:48px;height:48px;min-width:44px;min-height:48px;padding:3px 2px;border:1px solid #486679;border-radius:9px;text-align:center;background:#102634d9;color:#c9e3ed;overflow:hidden}
#flight-controls svg{display:block;width:23px;height:23px;margin:0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#weapons button small,#bomb small,#boost small{display:block;font-size:12px;line-height:16px;margin:1px 0 0;letter-spacing:0;color:inherit;white-space:nowrap}
#weapons .ammo,#bomb em{position:absolute;right:3px;top:2px;min-width:12px;border-radius:3px;background:#10212eee;padding:0 1px;color:#ccecf7;font-size:12px;line-height:13px;font-style:normal;font-variant-numeric:tabular-nums;pointer-events:none}
#weapons button.active{border:2px solid #8ceeff;background:#245065;color:#fff;padding:2px 1px;box-shadow:inset 0 -3px #8ceeff}#weapons button.active svg{stroke-width:2.3}

/* ---- AFTERBURN overhaul: hangar, results, sector tally ---- */
#power{display:block;font-size:11px;margin-top:5px;color:#ffb27a;letter-spacing:1px}

.rank-S{color:#ffe36e}.rank-A{color:#ff9e55}.rank-B{color:#6ae5ff}.rank-C{color:#9fd6a8}.rank-D{color:#9aa9b8}

const TRACKS={
 menu:{bpm:92,style:'menu',
  chords:[[57,60,64,67],[53,57,60,64],[55,59,60,64],[55,59,62,64]],roots:[45,41,48,40],
  lead:seq(`E5 . . . . . . . D5 . . . C5 . . .  C5 . . . . . . . A4 . . . . . . .  G4 . . . . . C5 . . . D5 . . . E5 .  B4 . . . . . . . - . . . . . . .`)},
 stage:{bpm:138,style:'stage',
  chords:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],roots:[45,41,48,43],
  lead:seq(`A4 . . . E5 . . . D5 . C5 . B4 . C5 .  A4 . . . . . . . - . F4 . A4 . C5 .  G5 . . . E5 . . . C5 . D5 . E5 . G5 .  D5 . . . B4 . . . G4 . A4 . B4 . D5 .`)},
 boss:{bpm:152,style:'boss',
  chords:[[50,53,57],[50,53,58],[48,52,55],[49,52,57]],roots:[38,34,36,33],
  lead:seq(`D5 . . D5 . . F5 . . E5 . . D5 . C5 .  D5 . . . . . A4 . . . Bb4 . . . A4 .  G4 . . C5 . . E5 . . G5 . . F5 . E5 .  E5 . . . C#5 . . . A4 . . . E5 . A5 .`)}
};
const FX_GAP={shot:.055,laser:.06,spread:.06,missile:.12,wing:.09,hit:.04,kill:.045,graze:.05,big:.09,pick:.05,dive:.2};
class Synth{
 constructor(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=this.c=new AC();
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.25;comp.connect(c.destination);

  this.verb=c.createConvolver();this.verb.buffer=this.impulse(2.4,2.8);this.verbIn=c.createGain();this.verbIn.gain.value=.32;this.verbIn.connect(this.verb);this.verb.connect(this.master);
  this.delayIn=c.createGain();this.delayIn.gain.value=.3;const d=c.createDelay(1),fb=c.createGain();d.delayTime.value=.33;fb.gain.value=.34;this.delayIn.connect(d);d.connect(fb);fb.connect(d);d.connect(this.mbus);d.connect(this.verbIn);
  const len=c.sampleRate*2;this.noiseBuf=c.createBuffer(1,len,c.sampleRate);const data=this.noiseBuf.getChannelData(0);for(let i=0;i<len;i++)data[i]=Math.random()*2-1;
  // Jet engine: low triangle plus filtered rumble, both following thrust.
  this.engineGain=c.createGain();this.engineGain.gain.value=0;this.engineGain.connect(this.sfx);

  this.roar=c.createBufferSource();this.roar.buffer=this.noiseBuf;this.roar.loop=true;this.roarFilter=c.createBiquadFilter();this.roarFilter.type='lowpass';this.roarFilter.frequency.value=380;this.roarGain=c.createGain();this.roarGain.gain.value=.55;this.roar.connect(this.roarFilter);this.roarFilter.connect(this.roarGain);this.roarGain.connect(this.engineGain);this.roar.start();

 impulse(sec,decay){const c=this.c,n=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}

  node.connect(a);a.connect(o.dest||this.sfx);if(o.verb)a.connect(this.verbIn);if(o.echo)a.connect(this.delayIn);}

 tone(f,d=.1,type='sine',v=.1,end=f){if(!this.ok()||muted)return;this.voice({f,d,type,v,end})}
 fx(n){if(!this.ok()||muted)return;const t=this.c.currentTime,gap=FX_GAP[n];if(gap){if(t-(this.last[n]||0)<gap)return;this.last[n]=t}const V=this.voice.bind(this),N=this.noise.bind(this);
  switch(n){
  case 'shot':V({type:'square',f:1150,end:520,d:.045,v:.022,filter:'lowpass',ff:3200});break;
  case 'laser':V({type:'sawtooth',f:2100,end:700,d:.09,v:.026,filter:'lowpass',ff:4200});V({f:1400,end:900,d:.06,v:.03});break;
  case 'missile':N({filter:'bandpass',ff:800,fend:3200,q:1.4,d:.24,v:.09});V({type:'triangle',f:220,end:90,d:.16,v:.03});break;
  case 'spread':V({type:'square',f:520,end:180,d:.07,v:.022,filter:'lowpass',ff:2400});N({filter:'highpass',ff:3000,d:.04,v:.03});break;
  case 'wing':V({type:'square',f:1500,end:800,d:.03,v:.01});break;
  case 'hit':N({filter:'highpass',ff:2600,d:.035,v:.06});V({type:'square',f:260,end:140,d:.04,v:.02});break;
  case 'kill':N({filter:'lowpass',ff:2000,fend:180,d:.4,v:.34,verb:1});V({f:140,end:38,d:.3,v:.34});break;
  case 'big':N({filter:'lowpass',ff:1200,fend:70,d:1.1,v:.5,verb:1});V({f:95,end:28,d:.85,v:.5});N({filter:'highpass',ff:4200,d:.14,v:.1});break;
  case 'part':N({filter:'lowpass',ff:1600,fend:120,d:.7,v:.45,verb:1});V({type:'square',f:320,end:60,d:.32,v:.07,filter:'lowpass',ff:1800});V({f:110,end:30,d:.5,v:.4});break;
  case 'boss':N({filter:'lowpass',ff:900,fend:40,d:2.8,v:.62,verb:1,a:.01});V({f:72,end:20,d:2.2,v:.6});N({filter:'highpass',ff:3800,d:.3,v:.14});for(let i=0;i<5;i++)N({t:t+.25+i*.32,filter:'lowpass',ff:1500,fend:100,d:.5,v:.3,verb:1});break;
  case 'hurt':V({type:'sawtooth',f:440,end:70,d:.42,v:.15,filter:'lowpass',ff:2200});N({filter:'bandpass',ff:900,d:.28,v:.32});V({f:90,end:40,d:.3,v:.3});break;
  case 'down':N({filter:'lowpass',ff:1400,fend:50,d:2,v:.6,verb:1});V({type:'sawtooth',f:300,end:30,d:1.4,v:.12,filter:'lowpass',ff:1200});V({f:80,end:22,d:1.6,v:.5});break;
  case 'nova':N({filter:'bandpass',ff:300,fend:4000,q:1.2,d:.45,v:.28});N({t:t+.32,filter:'lowpass',ff:1500,fend:55,d:1.7,v:.6,verb:1});V({t:t+.32,f:62,end:22,d:1.3,v:.6});break;
  case 'pick':V({f:880,d:.08,v:.09});V({t:t+.06,f:1320,d:.13,v:.08});break;
  case 'power':['C6','E6','G6','C7'].forEach((k,i)=>V({t:t+i*.055,type:'triangle',f:hz(midiOf(k)),d:.16,v:.08,verb:1}));break;
  case 'boost':V({type:'sawtooth',f:160,end:1300,d:.7,v:.08,filter:'lowpass',ff:600,fend:6000});N({filter:'highpass',ff:900,fend:7000,d:.7,v:.1,a:.3});break;

 // Percussion and instruments used by the sequencer. All go to the music bus.

 wantTrack(){if(state==='menu'||state==='upgrade')return 'menu';if(state!=='playing'||!g||g.dying>0||g.bossDeath)return null;return g.boss||g.warning>0?'boss':'stage'}

const world={theme:0,ground:[],clouds:[],high:[],cars:[],lightning:0,nextBolt:5,bolt:null,speed:1};
function blob(r,n=11){return Array.from({length:n},(_,i)=>{const a=i/n*TAU,k=r*rand(.65,1.15);return [Math.cos(a)*k,Math.sin(a)*k*.8]})}
function groundItem(kind,y){const T=THEMES[world.theme].ground;
 if(T==='ocean')return Math.random()<.035?{k:'island',x:rand(0,W),y,r:rand(34,80),pts:null}:{k:'wave',x:rand(0,W),y,len:rand(10,34)};
 if(T==='desert')return Math.random()<.2?{k:'rock',x:rand(0,W),y,r:rand(14,40)}:Math.random()<.16?{k:'crack',x:rand(0,W),y,pts:Array.from({length:6},(_,i)=>[rand(-40,40)+i*rand(-6,6),i*rand(18,30)])}:{k:'dune',x:rand(-60,W),y,w:rand(120,320),a:rand(.06,.14)};
 if(T==='city')return {k:'row',y,blocks:cityRow()};
 if(T==='storm')return {k:'wave',x:rand(0,W),y,len:rand(10,26)};
 return {k:'nebula',x:rand(0,W),y,r:rand(120,240),c:pick(['violet','blue','cyan'])};
}
function cityRow(){const out=[];let x=rand(-30,10);while(x<W+20){const w=rand(36,110);if(Math.random()<.86){const lights=Array.from({length:Math.floor(rand(2,9))},()=>[rand(4,w-6),rand(6,64),Math.random()<.7?'#ffd27a':'#8ee8ff']);out.push({x,w,h:rand(52,72),lights,neon:Math.random()<.12?pick(['violet','cyan','red']):null})}x+=w+rand(10,24)}return out}
function setTheme(i){world.theme=((i%THEMES.length)+THEMES.length)%THEMES.length;const T=THEMES[world.theme];world.ground=[];world.clouds=[];world.high=[];world.cars=[];world.bolt=null;world.lightning=0;
 const isCity=T.ground==='city',n=isCity?Math.ceil(H/86)+2:T.ground==='space'?3:T.ground==='desert'?26:T.ground==='storm'?40:70;for(let i=0;i<n;i++){const y=isCity?H+86-i*86:rand(-80,H+80);const o=groundItem(0,y);if(o.k==='island')o.pts=blob(o.r);if(o.k==='rock')o.pts=blob(o.r,8);world.ground.push(o)}
 const lo={ocean:5,desert:3,city:3,storm:9,space:1}[T.ground],hi={ocean:2,desert:1,city:1,storm:4,space:0}[T.ground];
 for(let i=0;i<lo;i++)world.clouds.push({x:rand(-60,W),y:rand(-100,H),s:rand(.9,1.8),v:Math.floor(rand(0,4)),spd:rand(.9,1.2)});
 for(let i=0;i<hi;i++)world.high.push({x:rand(-60,W),y:rand(-200,H),s:rand(1.4,2.4),v:Math.floor(rand(0,4)),spd:rand(.9,1.1)});
 if(isCity)for(let i=0;i<14;i++)world.cars.push({x:rand(0,W),y:rand(0,H),v:rand(40,120)*(Math.random()<.5?1:-1),red:Math.random()<.5})}
function updateWorld(dt){const T=THEMES[world.theme],sp=world.speed,gy=70*sp*dt;
 for(const o of world.ground){o.y+=gy*(o.k==='nebula'?.25:1);const size=o.k==='row'?86:o.k==='nebula'?o.r:o.r||o.len||60;if(o.y-size>H+40){if(o.k==='row'){o.y-=Math.ceil(H/86+2)*86;o.blocks=cityRow()}else{const n=groundItem(0,-rand(40,140));if(n.k==='island')n.pts=blob(n.r);if(n.k==='rock')n.pts=blob(n.r,8);Object.assign(o,n)}}}
 for(const c of world.clouds){c.y+=165*sp*c.spd*dt;if(c.y>H+60){c.y=-170*c.s-rand(0,120);c.x=rand(-80,W-60);c.v=Math.floor(rand(0,4))}}
 for(const c of world.high){c.y+=380*sp*c.spd*dt;if(c.y>H+40){c.y=-170*c.s-rand(100,500);c.x=rand(-120,W-80)}}
 for(const c of world.cars){c.y+=(c.v+70*sp)*dt;if(c.y>H+10)c.y=-10;if(c.y<-12)c.y=H+8}
 if(T.ground==='storm'){world.nextBolt-=dt;world.lightning=Math.max(0,world.lightning-dt*2.6);if(world.nextBolt<=0){world.nextBolt=rand(3.5,8);world.lightning=1;let x=rand(W*.1,W*.9),y=-10;world.bolt=[[x,y]];while(y<H*.6){x+=rand(-40,40);y+=rand(20,50);world.bolt.push([x,y])}if(state==='playing'||state==='menu')fx('thunder')}}}
function drawGround(){const T=THEMES[world.theme],bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,T.sky[0]);bg.addColorStop(.55,T.sky[1]);bg.addColorStop(1,T.sky[2]);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);const kind=T.ground;
 if(kind==='space'){for(const o of world.ground){ctx.globalCompositeOperation='lighter';sprite(SPR[o.c](),o.x,o.y,o.r*2,.12);ctx.globalCompositeOperation='source-over'}ctx.globalAlpha=1;
  for(const s of stars){const y=(s.y*H+ambient*(8+s.z*40)*world.speed)%H;ctx.fillStyle=`rgba(200,230,255,${s.z*.75})`;ctx.fillRect(s.x*W,y,s.z*1.7,s.z*(world.speed>1.3?9:2.4))}
  const R=Math.max(W,H)*1.4,cy=H+R*.82,eg=ctx.createRadialGradient(W/2,cy,R*.9,W/2,cy,R*1.04);eg.addColorStop(0,'rgba(20,60,120,.9)');eg.addColorStop(.8,'rgba(70,170,255,.45)');eg.addColorStop(1,'rgba(90,190,255,0)');ctx.fillStyle=eg;ctx.beginPath();ctx.arc(W/2,cy,R*1.04,0,TAU);ctx.fill();return}
 if(kind==='ocean'||kind==='storm'){ctx.globalCompositeOperation='lighter';const gl=ctx.createRadialGradient(W*.82,-H*.05,0,W*.82,-H*.05,H*.95);gl.addColorStop(0,kind==='ocean'?'rgba(255,170,110,.32)':'rgba(120,150,190,.08)');gl.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle=kind==='ocean'?'rgba(200,236,255,.16)':'rgba(170,190,215,.08)';ctx.lineWidth=1.4;ctx.beginPath();for(const o of world.ground)if(o.k==='wave'){const wob=Math.sin(ambient*1.5+o.y*.05)*4;ctx.moveTo(o.x+wob,o.y);ctx.quadraticCurveTo(o.x+o.len/2+wob,o.y-3,o.x+o.len+wob,o.y)}ctx.stroke();
  for(const o of world.ground)if(o.k==='island'){ctx.save();ctx.translate(o.x,o.y);ctx.lineWidth=5;ctx.strokeStyle='rgba(220,245,255,.22)';ctx.beginPath();o.pts.forEach(([x,y],i)=>i?ctx.lineTo(x*1.12,y*1.12):ctx.moveTo(x*1.12,y*1.12));ctx.closePath();ctx.stroke();path(o.pts,'#a8915e');path(o.pts.map(([x,y])=>[x*.78,y*.78]),'#2c5a3a');path(o.pts.map(([x,y])=>[x*.45+4,y*.45-2]),'#3c6e46');ctx.restore()}return}
 if(kind==='desert'){for(const o of world.ground){if(o.k==='dune'){ctx.strokeStyle=`rgba(0,0,0,${o.a})`;ctx.lineWidth=7;ctx.beginPath();for(let i=0;i<=8;i++){const x=o.x+i/8*o.w,y=o.y+Math.sin(i/8*Math.PI*2+o.x)*10;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();ctx.strokeStyle='rgba(255,196,140,.06)';ctx.lineWidth=2;ctx.stroke()}
  else if(o.k==='crack'){ctx.lineCap='round';ctx.strokeStyle='rgba(18,9,4,.75)';ctx.lineWidth=6;ctx.beginPath();o.pts.forEach(([x,y],i)=>i?ctx.lineTo(o.x+x,o.y+y):ctx.moveTo(o.x+x,o.y+y));ctx.stroke();ctx.strokeStyle='rgba(150,90,50,.35)';ctx.lineWidth=2;ctx.stroke();ctx.lineCap='butt'}
  else if(o.k==='rock'){ctx.save();ctx.translate(o.x,o.y);path(o.pts,'#24150c');path(o.pts.map(([x,y])=>[x*.7-3,y*.7-3]),'#3a2416');ctx.restore()}}return}
 if(kind==='city'){for(const row of world.ground)for(const b of row.blocks){ctx.fillStyle='#0d1426';ctx.fillRect(b.x,row.y,b.w,b.h);ctx.strokeStyle='#1d2944';ctx.lineWidth=1;ctx.strokeRect(b.x+.5,row.y+.5,b.w-1,b.h-1);for(const [lx,ly,c] of b.lights){ctx.fillStyle=c;ctx.globalAlpha=.55+Math.sin(ambient*2+lx)*.2;ctx.fillRect(b.x+lx,row.y+ly%b.h,2,2)}ctx.globalAlpha=1;if(b.neon){ctx.globalCompositeOperation='lighter';sprite(SPR[b.neon](),b.x+b.w/2,row.y+b.h/2,b.w*1.1,.32);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}}
  ctx.globalCompositeOperation='lighter';for(const c of world.cars)sprite(SPR[c.red?'red':'white'](),c.x,c.y,9,.8);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}}
function drawClouds(list,alpha){const T=THEMES[world.theme];for(const c of list){const s=cloudSprite(world.theme,c.v);ctx.globalAlpha=alpha*T.cloudAlpha;ctx.drawImage(s,c.x,c.y,260*c.s,170*c.s)}ctx.globalAlpha=1}
function drawWeather(){if(world.lightning>0){ctx.fillStyle=`rgba(220,235,255,${world.lightning*(reduced?.05:.16)})`;ctx.fillRect(0,0,W,H);if(world.bolt&&world.lightning>.45){ctx.strokeStyle=`rgba(235,245,255,${world.lightning})`;ctx.lineWidth=2.4;ctx.beginPath();world.bolt.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}}
 if(world.speed>1.25&&!reduced){ctx.strokeStyle='rgba(220,245,255,.22)';ctx.lineWidth=1.2;ctx.beginPath();for(let i=0;i<18;i++){const x=(i*137.5+ambient*13)%W,y=(i*263+ambient*1400)%(H+200)-100;ctx.moveTo(x,y);ctx.lineTo(x,y+60+i%3*30)}ctx.stroke()}}

// ---- Particles -------------------------------------------------------------------------------------
function addP(p){if(particles.length<Math.floor(440*quality))particles.push(p)}
function burst(x,y,c='#ffae68',n=18){const m=Math.ceil(n*quality);for(let i=0;i<m;i++){const a=rand(0,TAU),s=rand(60,260);addP({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.15,.4),max:.4,c})}rings.push({x,y,r:3,grow:160,life:.25,max:.25,c,w:1.5});if(rings.length>24)rings.shift()}
function explode(x,y,size=1,tint='#ffd2a0'){const q=(reduced?.6:1)*quality;addP({k:'flash',x,y,r:size*48,life:.14,max:.14});
 for(let i=0;i<Math.ceil(6*size*q);i++){const a=rand(0,TAU),s=rand(15,95)*size;addP({k:'fire',x:x+rand(-8,8)*size,y:y+rand(-8,8)*size,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(9,17)*size,grow:rand(14,34)*size,life:rand(.32,.7),max:.7})}
 for(let i=0;i<Math.ceil(4*size*q);i++){const a=rand(0,TAU),s=rand(10,50)*size;addP({k:'smoke',x:x+rand(-10,10)*size,y:y+rand(-10,10)*size,vx:Math.cos(a)*s,vy:Math.sin(a)*s+30,r:rand(10,18)*size,grow:rand(20,40)*size,life:rand(.9,1.6),max:1.6})}
 for(let i=0;i<Math.ceil(11*size*q);i++){const a=rand(0,TAU),s=rand(140,460)*Math.sqrt(size);addP({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.22,.55),max:.55,c:tint})}
 for(let i=0;i<Math.ceil(4*size*q);i++){const a=rand(0,TAU),s=rand(60,200)*Math.sqrt(size);addP({k:'debris',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,rot:rand(0,TAU),vr:rand(-12,12),s:rand(2,4.5)*Math.sqrt(size),life:rand(.6,1.1),max:1.1})}
 rings.push({x,y,r:5*size,grow:250*size,life:.36,max:.36,c:'#ffb070',w:2});if(rings.length>24)rings.shift()}
function label(x,y,t,c='#8ef0ff',size=13){labels.push({x,y,t,c,life:1,max:1,size});if(labels.length>22)labels.shift()}
function updateFx(dt){for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.k==='spark'){p.vx*=1-dt*2.2;p.vy*=1-dt*2.2}else if(p.k==='fire'||p.k==='smoke'){p.vx*=1-dt*1.8;p.vy*=1-dt*1.8;p.r+=p.grow*dt;if(p.k==='smoke')p.vy+=40*dt}else if(p.k==='debris'){p.rot+=p.vr*dt;p.vx*=1-dt;p.vy*=1-dt}}particles=particles.filter(p=>p.life>0);
 for(const r of rings){r.r+=r.grow*dt*(r.life/r.max+.15);r.life-=dt}rings=rings.filter(r=>r.life>0);for(const l of labels){l.life-=dt;l.y-=dt*30}labels=labels.filter(l=>l.life>0)}
function drawParticles(){for(const p of particles){if(p.k==='smoke'){sprite(SPR.smoke(),p.x,p.y,p.r*2,clamp(p.life/p.max,0,1)*.85)}else if(p.k==='debris'){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle='#2b2622';ctx.fillRect(-p.s,-p.s*.6,p.s*2,p.s*1.2);ctx.fillStyle='#ffb070';ctx.fillRect(-p.s,-p.s*.6,p.s*.6,p.s*.6);ctx.restore()}}
 ctx.globalCompositeOperation='lighter';for(const p of particles){const a=clamp(p.life/p.max,0,1);if(p.k==='fire')sprite(SPR.fire(),p.x,p.y,p.r*2,a);else if(p.k==='flash')sprite(SPR.white(),p.x,p.y,p.r*2*(1.4-a*.4),a);else if(p.k==='spark'){ctx.globalAlpha=a;ctx.strokeStyle=p.c;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.stroke()}}
 for(const r of rings){ctx.globalAlpha=clamp(r.life/r.max,0,1)*.5;ctx.strokeStyle=r.c;ctx.lineWidth=r.w||2;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke()}ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}
function drawLabels(){ctx.textAlign='center';ctx.lineJoin='round';for(const l of labels){const age=l.max-l.life,pop=age<.12?1+(1-age/.12)*.5:1;ctx.globalAlpha=clamp(l.life*1.6,0,1);ctx.font=`900 ${Math.round(l.size*pop)}px system-ui,Arial`;ctx.lineWidth=3;ctx.strokeStyle='rgba(3,10,18,.75)';ctx.strokeText(l.t,l.x,l.y);ctx.fillStyle=l.c;ctx.fillText(l.t,l.x,l.y)}ctx.globalAlpha=1}

function notify(t,d=2){$('notice').textContent=t;if(g)g.noticeTime=d}

// ---- Enemies & waves --------------------------------------------------------------------------------
const ENEMY_STATS={0:{hp:2,r:17,pts:50},1:{hp:3,r:17,pts:80},2:{hp:12,r:26,pts:300},3:{hp:3,r:16,pts:120},4:{hp:2,r:15,pts:60},5:{hp:9,r:22,pts:200}};
function enemy(type,x,y,extra){const S=ENEMY_STATS[type],hp=S.hp*(1+(g.sector-1)*.2)*loopMul();return Object.assign({x,y,base:x,type,hp,max:hp,r:S.r,pts:S.pts,age:0,fire:rand(1.4,2.8),vy:(type===1?100:type===2?42:type===5?0:60)+g.sector*5,vx:0,flash:0,dead:false},extra||{})}
function addEnemy(e){if(enemies.length<30)enemies.push(e);return e}
function later(t,fn){g.queue.push({t,fn})}
function formation(n){const id=++g.formId;g.forms[id]={left:n,killed:0,n};return id}
const WAVES={
 intro(){addEnemy(enemy(0,clamp(g.p.x,25,W-25),-20));return 1.3},
 singles(){const n=2+Math.min(3,g.sector);for(let i=0;i<n;i++)later(i*.35,()=>addEnemy(enemy(0,rand(30,W-30),-30)));return 2.2},
 weavers(){const x=rand(70,W-70);for(let i=0;i<3;i++)later(i*.32,()=>addEnemy(enemy(1,x,-30)));return 2.4},

function drawFlightTrail(){if(reduced||!g.flight)return;const trail=g.flight.trail,span=g.af.id==='goliath'?36:g.af.id==='valkyrie'?28:27;for(const side of [-1,1]){ctx.lineWidth=1.3;for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i];ctx.strokeStyle=`rgba(220,240,255,${b.life*.4})`;ctx.beginPath();ctx.moveTo(a.x+side*span*.8*Math.cos(a.bank),a.y+12+side*span*.8*Math.sin(a.bank));ctx.lineTo(b.x+side*span*.8*Math.cos(b.bank),b.y+12+side*span*.8*Math.sin(b.bank));ctx.stroke()}}}

function drawBeams(){for(const b of beams){if(b.warn>0){const blink=reduced?.5:.35+Math.abs(Math.sin(ambient*14))*.4;ctx.fillStyle=`rgba(255,60,120,${blink*.18})`;ctx.fillRect(b.x-b.w/2,0,b.w,H);ctx.strokeStyle=`rgba(255,90,140,${blink})`;ctx.setLineDash([8,8]);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(b.x-b.w/2,0);ctx.lineTo(b.x-b.w/2,H);ctx.moveTo(b.x+b.w/2,0);ctx.lineTo(b.x+b.w/2,H);ctx.stroke();ctx.setLineDash([])}

  ctx.textAlign='center';ctx.fillStyle=`rgba(255,80,90,${pulse})`;ctx.font=`900 ${Math.min(54,W*.11)}px system-ui,Arial`;ctx.fillText('WARNING',W/2,y+12);ctx.font='700 12px system-ui,Arial';ctx.fillStyle='#ffd0d4';ctx.fillText(`HUGE ENEMY APPROACHING — ${BOSSES[(g.sector-1)%3].name}`,W/2,y+30);ctx.globalAlpha=1}
 if(g.banner){const b=g.banner,t=b.t,inK=Math.min(1,t/.35),outK=Math.min(1,(b.d-t)/.4),k=Math.min(inK,outK),ease=1-Math.pow(1-inK,3),x=W/2+(1-ease)*-W*.3;ctx.globalAlpha=clamp(k,0,1);ctx.textAlign='center';ctx.fillStyle='rgba(4,12,22,.45)';ctx.fillRect(0,H*.42-40,W,74);ctx.fillStyle='#8ef0ff';ctx.fillRect(W/2-60*ease,H*.42-40,120*ease,2);ctx.font=`900 ${Math.min(40,W*.085)}px system-ui,Arial`;ctx.fillStyle='#eafcff';ctx.fillText(b.title,x,H*.42);ctx.font='700 13px system-ui,Arial';ctx.fillStyle='#9fdcf0';ctx.fillText(b.sub,x,H*.42+22);ctx.globalAlpha=1}

function loop(t){const real=Math.min((t-last)/1000||0,.1);last=t;ambient+=reduced?real*.3:real;frameAvg+=(real-frameAvg)*.05;if(frameAvg>.027&&quality>.55)quality=.55;
